# SPDX-License-Identifier: Apache-2.0
# Shared Windows TensorRT setup: pip DLLs + pinned GitHub headers +
# generated MSVC import libs. Sets TENSORRT_ROOT for later steps.
name: setup-trt-windows
description: Fetch TensorRT 11.3 cu13 SDK pieces on Windows (no login needed)
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $trt = "$env:RUNNER_TEMP\trt"
        New-Item -ItemType Directory -Force -Path "$trt\include", "$trt\lib", "$trt\bin" | Out-Null
        python -m pip install -q "tensorrt-cu13-libs==11.3.0.99" --extra-index-url https://pypi.nvidia.com
        $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
        $dllDir = Split-Path (Get-ChildItem -Recurse -Path $site `
          -Filter nvinfer_11.dll | Select-Object -First 1).FullName
        if (-not $dllDir) { throw "nvinfer_11.dll not found after pip install" }
        Copy-Item "$dllDir\*.dll" "$trt\bin\"
        $cudaBin = Split-Path (Get-Command nvcc.exe -ErrorAction SilentlyContinue).Source
        if ($cudaBin) { Copy-Item "$cudaBin\cudart64_13.dll" "$trt\bin\" -ErrorAction SilentlyContinue }
        # v11.2 headers (no v11.3 tag exists upstream); API-compatible with
        # the 11.3 runtime.
        $tag = "v11.2"
        # Full include/ list (NvInfer.h pulls NvInferLegacyDims.h etc.).
        # 404-tolerant: skip names absent in v11.2.
        foreach ($h in @("NvInfer.h", "NvInferConsistency.h", "NvInferImpl.h",
                         "NvInferLegacyDims.h", "NvInferPlugin.h",
                         "NvInferPluginBase.h", "NvInferPluginUtils.h",
                         "NvInferRuntime.h", "NvInferRuntimeBase.h",
                         "NvInferRuntimeCommon.h", "NvInferRuntimePlugin.h",
                         "NvInferVersion.h")) {
          try {
            Invoke-WebRequest "https://raw.githubusercontent.com/NVIDIA/TensorRT/$tag/include/$h" `
              -OutFile "$trt\include\$h"
          } catch { echo "skip $h" }
        }
        if (-not (Test-Path "$trt\include\NvInferLegacyDims.h")) { throw "header download failed" }
        dumpbin /exports "$trt\bin\nvinfer_11.dll" | Out-String | Set-Content "$trt\nvinfer.txt"
        $exp = Get-Content "$trt\nvinfer.txt" | Select-String "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)" | ForEach-Object { $_.Matches.Groups[1].Value }
        "LIBRARY nvinfer_11.dll", "EXPORTS" + ($exp | ForEach-Object { "    $_" }) | Set-Content "$trt\nvinfer.def"
        lib /def:"$trt\nvinfer.def" /out:"$trt\lib\nvinfer.lib" /machine:x64
        if (-not (Test-Path "$trt\lib\nvinfer.lib")) { throw "import lib generation failed" }
        "TENSORRT_ROOT=$trt" >> $env:GITHUB_ENV
