# SPDX-License-Identifier: Apache-2.0
name: windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: "Open tmate SSH session on failure"
        type: boolean
        default: false

env:
  # TensorRT Windows zip URL (login-walled on NVIDIA's site: put a reachable
  # mirror in the TENSORRT_WINDOWS_URL repository variable, e.g. a release
  # asset of TensorRT-10.16.1.11 Windows CUDA 13.2).
  TRT_ZIP: ${{ vars.TENSORRT_WINDOWS_URL }}

jobs:
  build:
    # No GPU on hosted runners: compile + CPU-side checks only.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda
        with:
          cuda: "13.2.0"
          method: network

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch TensorRT SDK
        run: |
          $trt = "$env:RUNNER_TEMP\trt"
          New-Item -ItemType Directory -Force -Path "$trt\include", "$trt\lib", "$trt\bin" | Out-Null
          if ($env:TRT_ZIP) {
            # Full SDK zip mirror (preferred when provisioned).
            Invoke-WebRequest $env:TRT_ZIP -OutFile $env:RUNNER_TEMP/trt.zip
            Expand-Archive $env:RUNNER_TEMP/trt.zip C:\trt-full
            $inf = Get-ChildItem -Recurse -Path C:\trt-full -Filter NvInfer.h | Select-Object -First 1
            if (-not $inf) { throw "NvInfer.h not found in TRT zip" }
            "TENSORRT_ROOT=$($inf.Directory.Parent.FullName)" >> $env:GITHUB_ENV
            exit 0
          }
          # Automatic path, no login needed:
          # DLLs from NVIDIA's pip index + headers from GitHub + generated import lib.
          pip install --extra-index-url https://pypi.nvidia.com "tensorrt-cu13-libs==10.16.1.11"
          $dllDir = Split-Path (Get-ChildItem -Recurse -Path (python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])") `
            -Filter nvinfer_10.dll | Select-Object -First 1).FullName
          if (-not $dllDir) { throw "nvinfer_10.dll not found after pip install" }
          Copy-Item "$dllDir\*.dll" "$trt\bin\"
          $tag = "v10.16"
          foreach ($h in @("NvInfer.h", "NvInferVersion.h", "NvInferImpl.h", "NvInferRuntimeCommon.h", `
                           "NvInferPluginBase.h", "NvInferRuntimePlugin.h", "NvInferRuntime.h")) {
            Invoke-WebRequest "https://raw.githubusercontent.com/NVIDIA/TensorRT/$tag/include/$h" `
              -OutFile "$trt\include\$h"
          }
          if (-not (Test-Path "$trt\include\NvInferRuntime.h")) { throw "header download failed" }
          dumpbin /exports "$trt\bin\nvinfer_10.dll" | Out-String | Set-Content "$trt\nvinfer.txt"
          $exp = Get-Content "$trt\nvinfer.txt" | Select-String "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)" | ForEach-Object { $_.Matches.Groups[1].Value }
          "LIBRARY nvinfer_10.dll", "EXPORTS" + ($exp | ForEach-Object { "    $_" }) | Set-Content "$trt\nvinfer.def"
          lib /def:"$trt\nvinfer.def" /out:"$trt\lib\nvinfer.lib" /machine:x64
          if (-not (Test-Path "$trt\lib\nvinfer.lib")) { throw "import lib generation failed" }
          "TENSORRT_ROOT=$trt" >> $env:GITHUB_ENV

      - name: Configure and build (all cores)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_ARCHITECTURES=89 2>&1 | Tee-Object build-cmake.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build --parallel $env:NUMBER_OF_PROCESSORS 2>&1 | Tee-Object build-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Report logs to summary on failure
        if: failure()
        run: |
          echo '### cmake.log (tail)' >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path build-cmake.log) { Get-Content build-cmake.log -Tail 40 >> $env:GITHUB_STEP_SUMMARY }
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          echo '### build.log (tail)' >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path build-build.log) { Get-Content build-build.log -Tail 60 >> $env:GITHUB_STEP_SUMMARY }
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          $t = @()
          if (Test-Path build-cmake.log) { $t += "cmake:"; $t += Get-Content build-cmake.log -Tail 30 }
          if (Test-Path build-build.log) { $t += "build:"; $t += Get-Content build-build.log -Tail 40 }
          $msg = ($t -join "`n").Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          "CI_LOG_TAIL=$msg" >> $env:GITHUB_ENV

      - name: Publish log tail as annotation
        if: failure()
        run: echo "::notice title=ci-log-tail::${{ env.CI_LOG_TAIL }}"

      - name: Registration check (no GPU)
        run: |
          $env:PATH = "build;$env:TENSORRT_ROOT\lib;$env:CUDA_PATH\bin;$env:PATH"
          .\build\regcheck.exe .\build\trt_dit_plugins.dll

      - name: Python import check (no GPU/torch)
        run: |
          $env:PYTHONPATH = "python"
          python -c "import trt_dit_plugins as t; print(t.__version__, sorted(t.PLUGINS))"
          python -m compileall -q python/trt_dit_plugins

      - name: Debug session (tmate)
        if: failure() && inputs.debug
        uses: mxschmitt/action-tmate@v3
