# SPDX-License-Identifier: Apache-2.0
name: windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: "Open tmate SSH session on failure"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARCHS: "80-real;86-real;89-real;90-real;100-real;120-real;90-virtual"
  CCACHE_DIR: ${{ github.workspace }}\.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 2G
  # CUDA 13's host_config.h allowlist lags the rolling VS minors on hosted
  # runners. Env var (not CMAKE_CUDA_FLAGS) so CMake's compiler-id probe
  # also picks it up. MSVC stays ABI-compatible within 19.x.
  NVCC_APPEND_FLAGS: "-allow-unsupported-compiler"

jobs:
  build:
    # No GPU on hosted runners: compile + CPU-side checks only.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'test/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install compiler cache
        run: choco install ccache --no-progress --yes

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda
        with:
          cuda: "13.2.0"
          method: network

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # Pin toolset: newer cl majors have crashed cudafe in the past.
          # 14.44 == VS2022 17.14 (present on the image).
          toolset: "14.44"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch TensorRT SDK
        uses: ./.github/actions/setup-trt-windows

      - name: Configure and build (all cores)
        run: |
          # NOTE: capture first, Tee second. `$LASTEXITCODE` after
          # `... | Tee-Object` is Tee's own (always 0) and would mask a
          # build failure, sending a half-built tree into regcheck.
          $out = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES="${{ env.ARCHS }}" -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1
          $rc = $LASTEXITCODE
          $out | Tee-Object build-cmake.log
          if ($rc -ne 0) { exit $rc }
          $out = cmake --build build --parallel $env:NUMBER_OF_PROCESSORS 2>&1
          $rc = $LASTEXITCODE
          $out | Tee-Object build-build.log
          if ($rc -ne 0) { exit $rc }

      - name: Report logs to summary on failure
        if: failure()
        run: |
          echo '### cmake.log (tail)' >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path build-cmake.log) { Get-Content build-cmake.log -Tail 40 >> $env:GITHUB_STEP_SUMMARY }
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          echo '### build.log (tail)' >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path build-build.log) { Get-Content build-build.log -Tail 60 >> $env:GITHUB_STEP_SUMMARY }
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          $t = @()
          if (Test-Path build-cmake.log) { $t += "cmake:"; $t += Get-Content build-cmake.log -Tail 30 }
          if (Test-Path build-build.log) { $t += "build:"; $t += Get-Content build-build.log -Tail 40 }
          $msg = ($t -join "`n").Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          "CI_LOG_TAIL=$msg" >> $env:GITHUB_ENV

      - name: Publish log tail as annotation
        if: failure()
        run: echo "::notice title=ci-log-tail::${{ env.CI_LOG_TAIL }}"

      - name: Registration check (no GPU)
        run: |
          if (-not (Test-Path .\build\regcheck.exe)) { Write-Error "regcheck.exe missing: build step failed?"; exit 1 }
          $env:PATH = "build;$env:TENSORRT_ROOT\bin;$env:CUDA_PATH\bin;$env:PATH"
          .\build\regcheck.exe .\build\trt_dit_plugins.dll

      - name: Python import check (no GPU/torch)
        run: |
          $env:PYTHONPATH = "python"
          python -c "import trt_dit_plugins as t; print(t.__version__, sorted(t.PLUGINS))"
          python -m compileall -q python/trt_dit_plugins

      - name: ONNX surgery tests (CPU-only)
        run: |
          python -m pip install -q pytest "onnx>=1.20" "onnx-graphsurgeon>=0.3"
          $env:PYTHONPATH = "python"
          # GPU/torch tests skip themselves here; smoke runs on self-hosted.
          python -m pytest python/tests -q --ignore=python/tests/test_smoke.py

      - name: Build Wheel
        run: |
          New-Item -ItemType Directory -Force -Path python\trt_dit_plugins\lib | Out-Null
          Copy-Item build\ck_kernels.dll, build\trt_dit_plugins.dll python\trt_dit_plugins\lib\
          Copy-Item LICENSE, NOTICE python\trt_dit_plugins\
          python -m pip install -U setuptools wheel
          python -m pip wheel . -w dist --no-deps --no-build-isolation

      - name: Verify wheel contents
        shell: bash  # the heredoc is bash-only; pwsh rejects `python - <<`
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ("trt_dit_plugins/lib/trt_dit_plugins.dll",
                  "trt_dit_plugins/lib/ck_kernels.dll")
          for n in need:
              assert any(x.endswith(n) for x in names), (whl, n)
          print("wheel ok:", whl)
          PY

      - name: Test the installed wheel (CPU-only)
        run: |
          # Install the wheel and run from outside the repo so the source tree
          # cannot shadow the installed package. The plugin DLLs link
          # nvinfer_11.dll from TENSORRT_ROOT, which must stay on PATH.
          $env:PATH = "$env:TENSORRT_ROOT\bin;$env:CUDA_PATH\bin;$env:PATH"
          $whl = (Get-ChildItem dist\*.whl)[0].FullName
          python -m pip install -q --no-deps --force-reinstall $whl
          Set-Location $env:RUNNER_TEMP
          python -m pytest "$env:GITHUB_WORKSPACE\python\tests" -q --ignore="$env:GITHUB_WORKSPACE\python\tests\test_smoke.py"

      - name: Report compiler-cache statistics
        if: always()
        run: |
          if (Get-Command ccache -ErrorAction SilentlyContinue) { ccache --show-stats } else { Write-Host "ccache not available" }

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          retention-days: 7
          path: dist/*.whl
          if-no-files-found: error

      - name: Debug session (tmate)
        if: failure() && inputs.debug
        uses: mxschmitt/action-tmate@v3
