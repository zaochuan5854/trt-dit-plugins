# SPDX-License-Identifier: Apache-2.0
# Tag (v*) -> build per-platform wheels -> GitHub Release assets.
# Install: pip install --extra-index-url https://pypi.nvidia.com \
#   https://github.com/zaochuan5854/trt-dit-plugins/releases/download/<tag>/<whl>
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name"
        required: true

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

env:
  ARCHS: "80-real;86-real;89-real;90-real;90-virtual"
  NVCC_APPEND_FLAGS: "-allow-unsupported-compiler"

jobs:
  fast-release:
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.check.outputs.reused }}
    steps:
      - name: Check and reuse CI wheels
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          set -e
          echo "Checking CI artifacts for release: $TAG"
          # Resolve target commit SHA of the release tag
          TARGET_SHA=$(gh api "repos/${{ github.repository }}/commits/${TAG}" --jq .sha 2>/dev/null || echo "${{ github.sha }}")
          echo "Target commit SHA: $TARGET_SHA"

          # Search for successful runs of linux.yml and windows.yml on the same commit
          LINUX_RUN_ID=$(gh run list --repo "${{ github.repository }}" --commit "$TARGET_SHA" --workflow "linux.yml" --status success --json databaseId --jq '.[0].databaseId')
          WIN_RUN_ID=$(gh run list --repo "${{ github.repository }}" --commit "$TARGET_SHA" --workflow "windows.yml" --status success --json databaseId --jq '.[0].databaseId')

          echo "Linux CI Run ID: $LINUX_RUN_ID"
          echo "Windows CI Run ID: $WIN_RUN_ID"

          if [ -n "$LINUX_RUN_ID" ] && [ "$LINUX_RUN_ID" != "null" ] && [ -n "$WIN_RUN_ID" ] && [ "$WIN_RUN_ID" != "null" ]; then
            mkdir -p wheels
            echo "Downloading CI wheel artifacts..."
            if gh run download "$LINUX_RUN_ID" --repo "${{ github.repository }}" -n wheel-linux -D wheels && \
               gh run download "$WIN_RUN_ID" --repo "${{ github.repository }}" -n wheel-windows -D wheels; then
              echo "Both CI wheels downloaded successfully."
              ls -la wheels/
              echo "Uploading wheels to GitHub Release $TAG..."
              gh release upload "$TAG" wheels/*.whl --repo "${{ github.repository }}" --clobber
              echo "Successfully published CI wheels to release!"
              echo "reused=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "CI wheel artifacts not found or incomplete. Falling back to full build."
          echo "reused=false" >> "$GITHUB_OUTPUT"

  wheel-linux:
    needs: [fast-release]
    if: needs.fast-release.outputs.reused != 'true'
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.0.3-devel-ubuntu24.04
    env:
      TRT_VER: 11.3.0.99
      TRT_HEADERS_TAG: v11.2
      TENSORRT_ROOT: /tmp/trt
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl cmake ninja-build g++ python3 python3-pip
          rm -rf /var/lib/apt/lists/*
          pip3 install --break-system-packages -q \
            "tensorrt-cu13-libs==${TRT_VER}" \
            --extra-index-url https://pypi.nvidia.com
          pip3 install --break-system-packages --ignore-installed -U setuptools wheel
          # No cuda13.0 TRT debs exist: link against the pip libs, fetch
          # headers from GitHub (v11.2 headers + 11.3 runtime).
          TRT_LIB=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")/tensorrt_libs
          test -f "$TRT_LIB/libnvinfer.so.11"
          mkdir -p /tmp/trt/include /tmp/trt/lib
          for h in NvInfer.h NvInferImpl.h \
              NvInferLegacyDims.h NvInferPlugin.h NvInferPluginBase.h \
              NvInferPluginUtils.h NvInferRuntime.h NvInferRuntimeBase.h \
              NvInferRuntimeCommon.h NvInferRuntimePlugin.h NvInferVersion.h; do
            curl -fsSL "https://raw.githubusercontent.com/NVIDIA/TensorRT/${TRT_HEADERS_TAG}/include/$h" \
              -o "/tmp/trt/include/$h"
          done
          ln -sf "$TRT_LIB/libnvinfer.so.11" /tmp/trt/lib/libnvinfer.so
          echo "LD_LIBRARY_PATH=$TRT_LIB:$LD_LIBRARY_PATH" >> $GITHUB_ENV
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="${{ env.ARCHS }}"
          cmake --build build --parallel 2
          ./build/regcheck ./build/libtrt_dit_plugins.so
      - name: Wheel
        run: |
          mkdir -p python/trt_dit_plugins/lib
          cp build/libck_kernels.so build/libtrt_dit_plugins.so python/trt_dit_plugins/lib/
          cp LICENSE NOTICE python/trt_dit_plugins/
          pip3 wheel . -w dist --no-deps --no-build-isolation
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          retention-days: 7
          path: dist/*.whl

  wheel-windows:
    needs: [fast-release]
    if: needs.fast-release.outputs.reused != 'true'
    # Pinned to match windows.yml CI: newer cl majors have crashed cudafe
    # in the past.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.2.0"
          method: network
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: "14.44"
      - name: Fetch TensorRT SDK
        uses: ./.github/actions/setup-trt-windows
      - name: Configure and build (all cores)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTENSORRT_ROOT="$env:TENSORRT_ROOT" -DCMAKE_CUDA_ARCHITECTURES="${{ env.ARCHS }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .\build\regcheck.exe)) { Write-Error "regcheck.exe missing: build step failed?"; exit 1 }
          $env:PATH = "build;$env:TENSORRT_ROOT\bin;$env:CUDA_PATH\bin;$env:PATH"
          .\build\regcheck.exe .\build\trt_dit_plugins.dll
      - name: Wheel
        run: |
          New-Item -ItemType Directory -Force -Path python\trt_dit_plugins\lib | Out-Null
          Copy-Item build\ck_kernels.dll, build\trt_dit_plugins.dll python\trt_dit_plugins\lib\
          Copy-Item LICENSE, NOTICE python\trt_dit_plugins\
          python -m pip install -U setuptools wheel
          python -m pip wheel . -w dist --no-deps --no-build-isolation
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          retention-days: 7
          path: dist/*.whl

  release:
    needs: [fast-release, wheel-linux, wheel-windows]
    if: needs.fast-release.outputs.reused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true
      - name: Upload wheels to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" wheels/*.whl \
            --clobber
