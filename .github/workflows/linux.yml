# SPDX-License-Identifier: Apache-2.0
name: linux

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: "Open tmate SSH session on failure"
        type: boolean
        default: false

jobs:
  build:
    # No GPU on hosted runners: compile + CPU-side checks only
    # (registration via dlopen needs no GPU). GPU E2E stays on self-hosted.
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.0.3-devel-ubuntu24.04
    defaults:
      run:
        shell: bash
    env:
      TRT_VER: 11.3.0.99
      TRT_HEADERS_TAG: v11.2
      ARCHS: "80-real;86-real;89-real;90-real;90-virtual"
      DEBIAN_FRONTEND: noninteractive
      TENSORRT_ROOT: /tmp/trt
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl cmake ninja-build ccache g++ python3 python3-pip \
          && apt-get clean && rm -rf /var/lib/apt/lists/*
          pip3 install --break-system-packages -q \
            "tensorrt-cu13-libs==${TRT_VER}" \
            --extra-index-url https://pypi.nvidia.com
          pip3 install --break-system-packages --ignore-installed -U setuptools wheel
          # No cuda13.0 TRT debs exist: link against the pip libs, fetch
          # headers from GitHub (v11.2 headers + 11.3 runtime: same pattern
          # as the Windows action already used for 10.16).
          TRT_LIB=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")/tensorrt_libs
          test -f "$TRT_LIB/libnvinfer.so.11"
          mkdir -p /tmp/trt/include /tmp/trt/lib
          for h in NvInfer.h NvInferImpl.h \
              NvInferLegacyDims.h NvInferPlugin.h NvInferPluginBase.h \
              NvInferPluginUtils.h NvInferRuntime.h NvInferRuntimeBase.h \
              NvInferRuntimeCommon.h NvInferRuntimePlugin.h NvInferVersion.h; do
            curl -fsSL "https://raw.githubusercontent.com/NVIDIA/TensorRT/${TRT_HEADERS_TAG}/include/$h" \
              -o "/tmp/trt/include/$h"
          done
          ln -sf "$TRT_LIB/libnvinfer.so.11" /tmp/trt/lib/libnvinfer.so
          echo "LD_LIBRARY_PATH=$TRT_LIB:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Configure
        run: |
          # pipefail: without it, `| tee` masks a cmake failure (tee exits 0)
          # and a half-configured tree slides into the build.
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="${{ env.ARCHS }}" 2>&1 | tee /tmp/cmake.log

      - name: Build (2 jobs, hosted RAM is 16 GB)
        run: |
          set -o pipefail
          cmake --build build --parallel 2 2>&1 | tee /tmp/build.log

      - name: Report logs to summary on failure
        if: failure()
        run: |
          echo '### cmake.log (tail)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -40 /tmp/cmake.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### build.log (tail)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -60 /tmp/build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          df -h / >> $GITHUB_STEP_SUMMARY || true
          python3 - <<'EOF' >> $GITHUB_ENV
          import os
          chunks = []
          for tag, path, n in (("cmake", "/tmp/cmake.log", 30), ("build", "/tmp/build.log", 40)):
              try:
                  with open(path, errors="replace") as f:
                      lines = f.read().splitlines()[-n:]
              except OSError:
                  lines = ["<missing>"]
              chunks.append(tag + ":\n" + "\n".join(lines))
          msg = "\n".join(chunks).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"CI_LOG_TAIL={msg}")
          EOF

      - name: Publish log tail as annotation
        if: failure()
        run: echo "::notice title=ci-log-tail::${CI_LOG_TAIL}"

      - name: Registration check (no GPU)
        run: |
          test -x ./build/regcheck || { echo "regcheck missing: build step failed?"; exit 1; }
          ./build/regcheck ./build/libtrt_dit_plugins.so

      - name: Python import check (no GPU/torch)
        run: |
          PYTHONPATH=python python3 -c \
            "import trt_dit_plugins as t; print(t.__version__, sorted(t.PLUGINS))"
          python3 -m compileall -q python/trt_dit_plugins

      - name: ONNX surgery tests (CPU-only)
        run: |
          pip3 install --break-system-packages -q pytest "onnx>=1.20" "onnx-graphsurgeon>=0.3"
          PYTHONPATH=python python3 -m pytest python/tests/test_surgeon.py -q
          # test_rpn.py needs torch: runs in the GPU/self-hosted env, not here.

      - name: Build Wheel
        run: |
          mkdir -p python/trt_dit_plugins/lib
          cp build/libck_kernels.so build/libtrt_dit_plugins.so python/trt_dit_plugins/lib/
          cp LICENSE NOTICE python/trt_dit_plugins/
          pip3 wheel . -w dist --no-deps --no-build-isolation

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          retention-days: 7
          path: dist/*.whl

      - name: Debug session (tmate)
        if: failure() && inputs.debug
        uses: mxschmitt/action-tmate@v3
